<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="Latency budget bar for a card authorization: roughly one second total deadline, of which network and payment processor overhead consume part, the decision service and a single database update consume a small slice, leaving substantial headroom."><title>The auth decision — where the latency budget goes</title><style>
  /* Vesper, dark-only, same as the site: #101010 ground, #FFC799 for the path
     that carries the emphasis, #99FFE4 for the ledger, neutral greys for
     everything else. One palette, no media query: through `img` the old
     `prefers-color-scheme` block answered to the OS, not the site. The `.t-lbl`
     fills are load-bearing -- without one, SVG text falls back to black. */
  text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .bg { fill: #101010; }
  .s-cool { stroke: #99ffe4; color: #99ffe4; }
  .s-faint { stroke: #383838; color: #383838; }
  .s-fill-card { fill: #161616; }
  .s-fill-cool { fill: #0e1a17; }
  .s-fill-hot { fill: #201811; }
  .s-hot { stroke: #ffc799; color: #ffc799; }
  .s-stroke { stroke: #e5e5e5; }
  .t-edge { font-size: 10.5px; fill: #ababab; }
  .t-hdr { font-size: 10px; letter-spacing: .12em; fill: #7a7a7a; }
  .t-hot { font-size: 10.5px; fill: #ffc799; font-weight: 600; }
  .t-lbl { font-size: 12px; font-weight: 600; fill: #ffffff; }
  .t-lbl.s-cool { fill: #99ffe4; }
  .t-lbl.s-hot { fill: #ffc799; }
  .t-sub { font-size: 10.5px; fill: #7a7a7a; }
  </style>
      <rect class="bg" x="0" y="0" width="100%" height="100%"/>
      <defs>
        <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <text class="t-hdr" x="20" y="22">AUTHORIZATION DEADLINE · ~1000 ms BEFORE PAYMENT PROCESSOR APPLIES YOUR DEFAULT</text>

      <!-- budget bar -->
      <rect class="s-fill-card s-stroke" x="20" y="40" width="920" height="42" stroke-width="1.25"/>
      <rect class="s-fill-cool" x="21" y="41" width="220" height="40"/>
      <rect class="s-fill-hot"  x="241" y="41" width="120" height="40"/>
      <rect class="s-fill-hot"  x="361" y="41" width="46"  height="40"/>

      <g class="s-faint" stroke-width="1"><line x1="241" y1="40" x2="241" y2="82"/><line x1="361" y1="40" x2="361" y2="82"/><line x1="407" y1="40" x2="407" y2="82"/></g>

      <text class="t-sub" x="131" y="66" text-anchor="middle">network + payment processor</text>
      <text class="t-hot" x="301" y="60" text-anchor="middle">your service</text>
      <text class="t-hot" x="301" y="73" text-anchor="middle">risk rules · controls</text>
      <text class="t-hot" x="384" y="66" text-anchor="middle">DB</text>
      <text class="t-sub" x="674" y="66" text-anchor="middle">headroom — retries, GC pause, cold cache, a bad day</text>

      <g class="s-faint" stroke-width="1" fill="none">
        <line x1="20" y1="96" x2="20" y2="104"/><line x1="940" y1="96" x2="940" y2="104"/>
        <line x1="20" y1="100" x2="940" y2="100"/>
      </g>
      <text class="t-sub" x="20" y="118">0 ms</text>
      <text class="t-sub" x="407" y="118" text-anchor="middle">~300 ms — p99 target</text>
      <text class="t-sub" x="940" y="118" text-anchor="end">~1000 ms</text>

      <text class="t-lbl" x="20" y="152">Fail-open or fail-closed?</text>
      <text class="t-sub" x="20" y="170">Timeout means Visa or payment processor decides for you. Fail-closed declines a good customer;</text>
      <text class="t-sub" x="20" y="185">fail-open lends blind. It's a policy dial per platform, not an engineering default.</text>
    </svg>