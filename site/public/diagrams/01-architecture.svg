<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Architecture diagram: the card authorization decision runs synchronously against a single-row availability table and returns to payment processor within the deadline, while the general ledger write happens asynchronously via an outbox, with durable Postgres-backed jobs driving all long-running money-movement lifecycles."><title>Architecture — the hot path is not the ledger write</title><style>
  text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .s-cool { stroke: #1f5f66; color: #1f5f66; }
  .s-faint { stroke: #d3dade; }
  .s-fill-card { fill: #fbfcfc; }
  .s-fill-cool { fill: #dfeced; }
  .s-fill-hot { fill: #f5e4e0; }
  .s-hot { stroke: #ab2f1c; color: #ab2f1c; }
  .s-stroke { stroke: #12171c; }
  .t-edge { font-size: 10.5px; fill: #46545f; }
  .t-hdr { font-size: 10px; letter-spacing: .12em; fill: #7b8994; }
  .t-hot { font-size: 10.5px; fill: #ab2f1c; font-weight: 600; }
  .t-lbl { font-size: 12px; font-weight: 600; }
  .t-sub { font-size: 10.5px; fill: #7b8994; }
  @media (prefers-color-scheme: dark) {
    .s-cool { stroke: #6fb3ba; color: #6fb3ba; }
    .s-faint { stroke: #2a343a; }
    .s-fill-card { fill: #141a1e; }
    .s-fill-cool { fill: #142428; }
    .s-fill-hot { fill: #2c1a16; }
    .s-hot { stroke: #e2705a; color: #e2705a; }
    .s-stroke { stroke: #e4eaed; }
    .t-edge { font-size: 10.5px; fill: #9dabb4; }
    .t-hdr { font-size: 10px; letter-spacing: .12em; fill: #6d7c86; }
    .t-hot { font-size: 10.5px; fill: #e2705a; font-weight: 600; }
    .t-lbl { font-size: 12px; font-weight: 600; }
    .t-sub { font-size: 10.5px; fill: #6d7c86; }
  }
  </style>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
      </defs>

      <text class="t-hdr" x="20" y="20">EXTERNAL</text>
      <text class="t-hdr" x="270" y="20">SERVICES</text>
      <text class="t-hdr" x="580" y="20">STORES · POSTGRES</text>
      <text class="t-hdr" x="800" y="20">DERIVED</text>

      <!-- external column -->
      <g class="s-stroke" stroke-width="1.25">
        <rect class="s-fill-card" x="20" y="40" width="150" height="46"/>
        <rect class="s-fill-card" x="20" y="176" width="150" height="46"/>
        <rect class="s-fill-card" x="20" y="300" width="150" height="46"/>
      </g>
      <text class="t-lbl" x="95" y="60" text-anchor="middle">Visa</text>
      <text class="t-sub" x="95" y="76" text-anchor="middle">auth · clearing · settle</text>
      <text class="t-lbl" x="95" y="196" text-anchor="middle">payment processor</text>
      <text class="t-sub" x="95" y="212" text-anchor="middle">cards · ACH · accounts</text>
      <text class="t-lbl" x="95" y="320" text-anchor="middle">Lender</text>
      <text class="t-sub" x="95" y="336" text-anchor="middle">$30M facility</text>

      <line class="s-faint" x1="95" y1="86" x2="95" y2="176" stroke-width="1.25" marker-end="url(#ah)"/>

      <!-- services -->
      <g stroke-width="1.6" class="s-hot">
        <rect class="s-fill-hot" x="270" y="40" width="200" height="58"/>
      </g>
      <text class="t-lbl" x="370" y="64" text-anchor="middle" fill="currentColor">Auth Decision Svc</text>
      <text class="t-hot" x="370" y="82" text-anchor="middle">SYNCHRONOUS · p99 &lt; 300ms</text>

      <g class="s-stroke" stroke-width="1.25">
        <rect class="s-fill-card" x="270" y="176" width="200" height="58"/>
        <rect class="s-fill-card" x="270" y="300" width="200" height="58"/>
      </g>
      <text class="t-lbl" x="370" y="200" text-anchor="middle">Money Movement</text>
      <text class="t-sub" x="370" y="217" text-anchor="middle">durable jobs (Postgres)</text>
      <text class="t-lbl" x="370" y="324" text-anchor="middle">Ledger Writer</text>
      <text class="t-sub" x="370" y="341" text-anchor="middle">idempotent · append-only</text>

      <!-- stores -->
      <g class="s-hot" stroke-width="1.6">
        <rect class="s-fill-hot" x="580" y="46" width="180" height="46"/>
      </g>
      <text class="t-lbl" x="670" y="66" text-anchor="middle" fill="currentColor">availability + holds</text>
      <text class="t-hot" x="670" y="82" text-anchor="middle">one row per hold group</text>

      <g class="s-stroke" stroke-width="1.25">
        <rect class="s-fill-card" x="580" y="176" width="180" height="46"/>
        <rect class="s-fill-cool" x="580" y="300" width="180" height="58"/>
      </g>
      <text class="t-lbl" x="670" y="196" text-anchor="middle">outbox</text>
      <text class="t-sub" x="670" y="212" text-anchor="middle">at-least-once emit</text>
      <text class="t-lbl s-cool" x="670" y="324" text-anchor="middle" fill="currentColor">ledger</text>
      <text class="t-sub" x="670" y="341" text-anchor="middle">accounts · txns · entries</text>

      <!-- derived -->
      <g class="s-stroke" stroke-width="1.25">
        <rect class="s-fill-card" x="800" y="300" width="140" height="58"/>
      </g>
      <text class="t-lbl" x="870" y="322" text-anchor="middle">Warehouse</text>
      <text class="t-sub" x="870" y="338" text-anchor="middle">borrowing base</text>
      <text class="t-sub" x="870" y="352" text-anchor="middle">close · loan tape</text>

      <!-- hot path edges -->
      <g class="s-hot" stroke-width="1.8" fill="none">
        <line x1="170" y1="180" x2="270" y2="80" marker-end="url(#ah)"/>
        <line x1="470" y1="62" x2="580" y2="62" marker-end="url(#ah)"/>
        <line x1="580" y1="80" x2="470" y2="80" marker-end="url(#ah)"/>
        <line x1="270" y1="92" x2="172" y2="196" marker-end="url(#ah)"/>
      </g>
      <text class="t-hot" x="186" y="128">auth webhook</text>
      <text class="t-hot" x="186" y="141">~1s deadline</text>
      <text class="t-hot" x="525" y="55" text-anchor="middle">SELECT … FOR UPDATE</text>
      <text class="t-hot" x="525" y="97" text-anchor="middle">INSERT hold</text>
      <text class="t-hot" x="258" y="160" text-anchor="end">approve / decline</text>

      <!-- async edges -->
      <g class="s-faint" stroke-width="1.4" fill="none">
        <polyline points="370,176 370,125 700,125 700,94" marker-end="url(#ah)"/>
        <line x1="170" y1="206" x2="270" y2="206" marker-end="url(#ah)"/>
        <line x1="470" y1="199" x2="580" y2="199" marker-end="url(#ah)"/>
        <line x1="670" y1="222" x2="670" y2="290" marker-end="url(#ah)"/>
        <line x1="670" y1="290" x2="470" y2="329" marker-end="url(#ah)"/>
        <line x1="470" y1="329" x2="580" y2="329" marker-end="url(#ah)"/>
        <line x1="760" y1="329" x2="800" y2="329" marker-end="url(#ah)"/>
        <line x1="170" y1="323" x2="270" y2="323" marker-end="url(#ah)"/>
      </g>
      <text class="t-edge" x="490" y="119">clear / expire the hold</text>
      <text class="t-edge" x="176" y="188">clearing</text>
      <text class="t-edge" x="176" y="200">settlement</text>
      <text class="t-edge" x="492" y="192">enqueue</text>
      <text class="t-edge" x="684" y="262">drain</text>
      <text class="t-edge" x="492" y="322">append</text>
      <text class="t-edge" x="770" y="322">CDC</text>
      <text class="t-edge" x="184" y="317">draws</text>

      <g class="s-hot" stroke-width="3">
        <line x1="580" y1="404" x2="616" y2="404"/>
      </g>
      <text class="t-hot" x="624" y="408">synchronous · in the auth deadline</text>
      <g class="s-faint" stroke-width="3">
        <line x1="270" y1="404" x2="306" y2="404"/>
      </g>
      <text class="t-edge" x="314" y="408">asynchronous</text>
    </svg>