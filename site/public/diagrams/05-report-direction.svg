<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-label="Two ways to build a report. Building it from the entries lists only accounts that moved, so a chart line with no activity this period leaves an empty slot nobody can see. Building it from the chart lists every line first and attaches the numbers, so a line with no activity prints as zero."><title>Two ways to build a report, and the line that goes missing</title><style>
  /* Vesper, dark-only, same as the site: #101010 ground, #FFC799 -- the site's
     link colour -- for the flow edges, and the callout pair straight from the
     prose: #FF8080 for the line that goes missing, #99FFE4 for the one that
     prints as zero. One palette, no media query: through `img` the old
     `prefers-color-scheme` block answered to the OS, not the site. The
     arrowhead fill in `defs` repeats the edge colour because a marker cannot
     see its line's class. */
  text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .bg      { fill: #101010; }
  .box     { fill: #161616; stroke: #666666; stroke-width: 1; }
  .box-head{ fill: #1f1f1f; }
  .rule    { stroke: #2e2e2e; stroke-width: 1; }
  .divider { stroke: #2e2e2e; stroke-width: 1; stroke-dasharray: 3 5; }
  .gap     { fill: none; stroke: #ff8080; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .t-name  { font-size: 12px; font-weight: 600; fill: #ffffff; }
  .t-row   { font-size: 12px; fill: #a0a0a0; }
  .t-band  { font-size: 10px; letter-spacing: .14em; fill: #7a7a7a; }
  .t-edge  { font-size: 10.5px; fill: #ffc799; }
  .t-warn  { font-size: 11px; fill: #ff8080; }
  .t-ok    { font-size: 11px; fill: #99ffe4; }
  .edge    { stroke: #ffc799; stroke-width: 1.7; fill: none; }
</style>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>
<defs>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 1L10 5L0 9z" fill="#ffc799"/>
  </marker>
</defs>

<!-- LEFT: from the entries -->
<text class="t-band" x="30" y="30">BUILT FROM THE ENTRIES</text>

<rect class="box" x="30" y="48" width="176" height="118" rx="4"/>
<path class="box-head" d="M30 52a4 4 0 0 1 4-4h168a4 4 0 0 1 4 4v24H30z"/>
<line class="rule" x1="30" y1="76" x2="206" y2="76"/>
<text class="t-name" x="44" y="68">what moved</text>
<text class="t-row" x="44" y="100">cash          250</text>
<text class="t-row" x="44" y="122">receivables   500</text>
<text class="t-row" x="44" y="144">payables      750</text>

<line class="edge" x1="214" y1="107" x2="272" y2="107" marker-end="url(#r)"/>
<text class="t-edge" x="243" y="96" text-anchor="middle">group</text>

<rect class="box" x="280" y="48" width="190" height="140" rx="4"/>
<path class="box-head" d="M280 52a4 4 0 0 1 4-4h182a4 4 0 0 1 4 4v24H280z"/>
<line class="rule" x1="280" y1="76" x2="470" y2="76"/>
<text class="t-name" x="294" y="68">the report</text>
<text class="t-row" x="294" y="100">Cash            250</text>
<text class="t-row" x="294" y="122">Receivables     500</text>
<text class="t-row" x="294" y="144">Payables        750</text>
<rect class="gap" x="292" y="152" width="166" height="22" rx="3"/>

<text class="t-warn" x="30" y="222">A fourth line of the chart — Restricted cash — had</text>
<text class="t-warn" x="30" y="240">no activity this period. It is not shown as zero.</text>
<text class="t-warn" x="30" y="258">It was never enumerated, so nothing in the report</text>
<text class="t-warn" x="30" y="276">or in the totals can tell you it is missing.</text>

<line class="divider" x1="490" y1="16" x2="490" y2="330"/>

<!-- RIGHT: from the chart -->
<text class="t-band" x="510" y="30">BUILT FROM THE CHART</text>

<rect class="box" x="510" y="48" width="176" height="140" rx="4"/>
<path class="box-head" d="M510 52a4 4 0 0 1 4-4h168a4 4 0 0 1 4 4v24H510z"/>
<line class="rule" x1="510" y1="76" x2="686" y2="76"/>
<text class="t-name" x="524" y="68">every line</text>
<text class="t-row" x="524" y="100">cash</text>
<text class="t-row" x="524" y="122">restricted_cash</text>
<text class="t-row" x="524" y="144">receivables</text>
<text class="t-row" x="524" y="166">payables</text>

<line class="edge" x1="694" y1="118" x2="752" y2="118" marker-end="url(#r)"/>
<text class="t-edge" x="723" y="96" text-anchor="middle">attach what</text>
<text class="t-edge" x="723" y="108" text-anchor="middle">moved</text>

<rect class="box" x="760" y="48" width="190" height="140" rx="4"/>
<path class="box-head" d="M760 52a4 4 0 0 1 4-4h182a4 4 0 0 1 4 4v24H760z"/>
<line class="rule" x1="760" y1="76" x2="950" y2="76"/>
<text class="t-name" x="774" y="68">the report</text>
<text class="t-row" x="774" y="100">Cash            250</text>
<text class="t-row" x="774" y="122">Restricted cash   0</text>
<text class="t-row" x="774" y="144">Receivables     500</text>
<text class="t-row" x="774" y="166">Payables        750</text>

<text class="t-ok" x="510" y="222">A line with no activity prints as a zero rather than</text>
<text class="t-ok" x="510" y="240">vanishing. The report starts from the chart, so there</text>
<text class="t-ok" x="510" y="258">is no parameter anywhere in which to pass it an</text>
<text class="t-ok" x="510" y="276">incomplete list of accounts.</text>
</svg>
