name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    # The docs build reads site/ plus ONE file outside it: the committed
    # OpenAPI spec, which the build inlines into /api-reference/ — so a
    # spec-only change must redeploy too, or the site serves a stale contract.
    # Everything else (Rust code, migrations, spikes) does not redeploy.
    paths:
      - 'site/**'
      - 'crates/api/openapi.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let each push finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build the static site (project-page basePath = /openledger)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          # path is relative to the workspace root, not the job working-directory.
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
