# THE ANSWER THIS PROJECT WROTE DOWN THREE TIMES AND DID NOT WRITE.
#
# tests/run.sh carries nine guards, added over eight rounds of adversarial review,
# each one closing the forgery the previous round found. Its own header states the
# threat model those guards actually meet -- "they defend against EROSION ... and
# they do not defend against a determined author" -- and then names the durable
# answer: "review, and CI running a pinned configuration the branch cannot edit."
# docs/decisions/README.md listed "there is no CI" under Still open and called it
# the highest-leverage item there.
#
# This file is part of that answer, and the earlier version of this comment claimed
# more than it delivers. It said this was "the only check a branch cannot edit its
# way past, because it runs from the default branch's definition". That is false
# twice over. `on: pull_request` runs the workflow from the PR's own merge commit,
# not from the default branch -- that is what `pull_request_target` is for. And even
# a pinned workflow would still `run: ./tests/run.sh`, which is the BRANCH's copy of
# every guard. Nothing checked into a repository is un-editable by the branch;
# only branch protection with required status checks can do that, and this
# repository has no such configuration in-tree.
#
# What CI actually buys, which is worth having and is not what was claimed:
#   * a PINNED configuration -- Postgres 18, a fixed image, a fixed entrypoint --
#     so "it passed on my machine" stops being assertable;
#   * a machine the author does not control, so a green result is reproducible by
#     someone else;
#   * it runs on every push and every pull request without anyone remembering to.
# The in-tree guards in tests/run.sh are not made redundant by any of that. They
# are judged on their own in docs/decisions/README.md.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 18 is a floor, not a preference: uuidv7() is the default on
        # six tables and does not exist before 18.
        image: postgres:18
        env:
          POSTGRES_USER: openledger
          POSTGRES_PASSWORD: openledger
          POSTGRES_DB: postgres
        ports: [ '5433:5432' ]
        options: >-
          --health-cmd "pg_isready -U openledger"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run every suite
        run: ./tests/run.sh
        env:
          ADMIN_URL: postgres://openledger:openledger@localhost:5433/postgres?sslmode=disable

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
