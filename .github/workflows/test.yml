# CI. Four jobs: the Rust one, the one that puts DDL into a real PostgreSQL 18,
# the dependency policy (cargo deny), and the migrations-immutability guard.
#
# This file was deleted once already, with the SQL conformance suite it ran
# (ADR-0004). What it must not become is the thing this project keeps citing as
# the failure it is organised against: "a green check that didn't actually
# execute." So every step here either compares something or loads something into
# a server, and where a check is designed but not built it is a comment, not a
# step that exits 0.
#
# ADR-0008 is the reasoning for the parked-DDL steps in `schema`; ADR-0003 for `migrate`
# being a subcommand rather than a shell script; ADR-0007 §2 for the schema
# snapshot test the e2e suite carries (schema_snapshot.rs — both jobs run it).

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A migration run takes an advisory lock. Two of these racing on the same
# service container cannot happen -- each job gets its own -- but cancelling a
# superseded run is right anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deny warnings in the build as well as in clippy: `unsafe_code = "forbid"`
  # and the panic lints in Cargo.toml are the point of choosing Rust (ADR-0001).
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    # Finite on every job: a hung container pull or a wedged test must become
    # a failed run, not a six-hour default. Observed runs fit well inside.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Record what actually ran
        run: cargo --version && rustc --version && cargo clippy --version

      # `make tidy`, split so a failure names which half failed. `--workspace`
      # everywhere below: the root's default-members is just the binary (so
      # `cargo run -- migrate` stays the documented invocation), and without
      # the flag the library crates would be a green check that did not run.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No DATABASE_URL here — and no skip: without it the e2e suite starts
      # its own postgres:18-alpine testcontainer, and GitHub's ubuntu runners
      # have Docker, so the whole suite runs on the fallback path. The schema
      # job below runs it again on the env-URL path. (The fallback container
      # is named and reused, not leaked — support/postgres.rs; on a throwaway
      # runner that distinction costs nothing.)
      #
      # The binary is built FIRST, explicitly: the suite lives in crates/e2e
      # and spawns `openledger` resolved from the test executable's own path
      # (CARGO_BIN_EXE_* only exists for the package defining the binary), and
      # resolving an existing file guarantees no build.
      - name: cargo build -p openledger
        run: cargo build -p openledger
      - name: cargo test
        run: cargo test --workspace --all-targets

  schema:
    name: migrations against PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        # Pinned to the same image `docker-compose.yml` runs locally. 18 is a
        # floor, not a preference: `uuidv7()` is a PostgreSQL 18 built-in and
        # both the baseline and the parked card DDL default primary keys to it.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openledger
          POSTGRES_PASSWORD: openledger
          POSTGRES_DB: openledger
        ports:
          # 5433 on purpose: it is what `docker-compose.yml` publishes and what
          # the Makefile's DB_URL defaults to, so CI runs the same commands the
          # README tells an adopter to run rather than a private variant of them.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      PGPASSWORD: openledger
      PGHOST: localhost
      PGPORT: 5433
      PGUSER: openledger
      DATABASE_URL: postgres://openledger:openledger@localhost:5433/openledger?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Record what actually ran
        run: psql --version && psql -tAc 'select version()'

      # ---------------------------------------------------------------
      # The parked file's own guard, checked FIRST and for one reason.
      #
      # `parked/card/schema.sql` opens with a DO block that refuses to load
      # unless refuse_mutation(), refuse_truncate() and the openledger_app role
      # are present. Two of those three are per-database; the role is
      # CLUSTER-wide. So on any cluster where the baseline has run even once,
      # in any database, the role half of that guard passes vacuously. A fresh
      # service container is the only place the guard can be tested honestly,
      # and only before the first migrate. That is why this step is here and
      # not further down.
      - name: The parked card DDL refuses to load without the core
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE coreless_check'
          if psql -d coreless_check -v ON_ERROR_STOP=1 --single-transaction -q \
               -f parked/card/schema.sql 2>err.txt; then
            echo "::error::parked/card/schema.sql loaded into a database with no core -- its DO block did not fire"
            exit 1
          fi
          grep -q 'apply migrations/00001_baseline.sql first' err.txt
          # ...and it left nothing behind. The file has no BEGIN/COMMIT of its
          # own (it inherits the core's design), so --single-transaction is what
          # makes a failed load clean rather than half-applied.
          left=$(psql -d coreless_check -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r'")
          test "$left" = "0" || { echo "::error::a refused load stranded $left tables"; exit 1; }

      # ---------------------------------------------------------------
      # The documented path, run as documented (ADR-0003).
      - name: openledger migrate
        run: cargo run --locked -- migrate

      # Re-running the pre-deploy command is what a redeploy does, and the
      # roadmap records "idempotent on re-run" as verified and checked on
      # every push. This step is that check.
      - name: openledger migrate, again
        run: cargo run --locked -- migrate

      # Seed data, owned by no migration (ADR-0007 §9). It is an EXAMPLE chart;
      # loading it here proves the chart guard accepts the one we publish.
      - name: Seed the reference chart
        run: psql -d openledger -v ON_ERROR_STOP=1 --single-transaction -q -f schema/chart.sql

      # ---------------------------------------------------------------
      # The e2e suite: spawns the compiled binary, talks HTTP to it, and reads
      # `SELECT * FROM reconciliation` as the oracle. The rust job already ran
      # it on the container fallback; this run is NOT redundant — DATABASE_URL
      # is in the job env above, so it exercises the env-URL fast path that
      # `make test` and this job's own steps document. The suite creates its
      # own scratch databases — the ADR-0007 §2 schema-snapshot test among
      # them migrates and dumps its own migrate-only scratch database, never
      # this chart-seeded `openledger` one. (`-p e2e`: the suite is its own crate,
      # holding the test-only capability allowances; the binary it spawns was
      # built by the `cargo run -- migrate` steps above, and the explicit
      # build keeps that true if those steps ever move.)
      #
      # `--test-threads=2` is a connection budget, not a flake workaround, and
      # it belongs to THIS job only. A serving process holds
      # `db::POOL_CONNECTIONS` — one per dispatcher plus six, ADR-0018 §2 — and
      # every e2e test spawns its own `serve`. The service container above runs
      # PostgreSQL's default `max_connections` of 100, because GitHub service
      # containers accept `options:` but no command override: there is nowhere
      # to pass `-c max_connections=400`, which is exactly what the
      # testcontainer path DOES pass (support/postgres.rs) and why the `rust`
      # job above has never hit this. `ubuntu-latest` gives 4 test threads, so
      # at the pool depth ADR-0018 shipped (38) the demand here is ~152 plus the
      # migrator's, against 100. It has been passing on the tests' staggered
      # start, not on arithmetic. Two threads keeps it under the default with
      # headroom for the psql steps.
      #
      # The alternative considered: `ALTER SYSTEM SET max_connections` plus a
      # `docker restart` of the service container. Refused as more moving parts
      # in the one job whose value is that it runs the documented commands
      # against a stock server. If the pool depth drops, raise this back — the
      # number to keep true is `POOL_CONNECTIONS × threads < max_connections`.
      - name: e2e — a caller on the wire
        run: |
          cargo build --locked -p openledger
          cargo test --locked -p e2e --test e2e -- --test-threads=2

      - name: What the applied schema is
        run: |
          psql -d openledger -c "select
              (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r') as tables,
              (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'v') as views,
              (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'i') as indexes"

      # ---------------------------------------------------------------
      # ADR-0007 §2, the schema snapshot test, is NOT a step here on purpose:
      # it is a test in the e2e suite (schema_snapshot.rs), so the `cargo
      # test` above just ran it — and the rust job ran it again on the
      # container-fallback path. It migrates an empty scratch database with
      # the compiled binary, dumps the catalog as deterministic text, and
      # diffs it against the committed schema/snapshot.txt; regenerating the
      # snapshot is an explicit opt-in (make schema-snapshot), so a run here
      # can only ever FAIL on drift. It dumps its own scratch database, not
      # the chart-seeded `openledger` one: the snapshot is of the migrated
      # baseline alone, because the chart is seed data owned by no migration.

      # ---------------------------------------------------------------
      # The parked-DDL guard (ADR-0008). `parked/card/schema.sql` is applied by
      # no migration and owned by no test; its only attestation before this job
      # existed was that somebody pasted it into a database once by hand. It
      # depends on three objects the baseline creates. Nothing declares that
      # dependency to a machine, so the core could rename any of them and every
      # check in this repository would stay green.
      #
      # Its own database, for two reasons: the `openledger` database above
      # holds the documented baseline-plus-chart state and stays that way,
      # and this file is NOT idempotent -- a second load fails on
      # `type "auth_event_kind" already exists`. (The schema-snapshot test is
      # unaffected either way: it dumps its own scratch database.)
      - name: The parked card DDL still loads on top of the core
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE parked_check'
          DATABASE_URL='postgres://openledger:openledger@localhost:5433/parked_check?sslmode=disable' \
            cargo run --locked -- migrate
          before=$(psql -d parked_check -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r'")
          psql -d parked_check -v ON_ERROR_STOP=1 --single-transaction -q -f parked/card/schema.sql
          after=$(psql -d parked_check -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r'")
          echo "core $before tables -> core+card $after"
          # The file is 4 tables. Asserting the delta rather than just the exit
          # status is what makes a silently-shrinking parked file fail here.
          test "$after" = "$((before + 4))" || { echo "::error::expected 4 card tables, got $((after - before))"; exit 1; }

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The policy is deny.toml at the workspace root: advisories (the whole
      # graph, dev-dependencies included), the explicit license allowlist,
      # crates.io as the only source, and duplicate-version bans with the
      # commented skip list. The action pins its own cargo-deny build, so a
      # contributor without the binary still gets the same verdict here that
      # `make deny` gives locally.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  migrations-immutable:
    name: migrations are immutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs HEAD against a base commit, so history must be
          # present — a depth-1 tip has no merge base to compare against.
          fetch-depth: 0

      # ADR-0003: migrations are immutable once committed — the 00001
      # baseline included (frozen 2026-08-27, ahead of v0.1), and the script
      # carries deliberately no opt-out. On a pull request the base is the
      # PR's base commit and HEAD is the merge ref, which is the only place
      # two branches both claiming "the next number" are visible together.
      # On a push the base is the commit this push replaced.
      - name: migrations unchanged since base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          # A force-push or a first push has no usable `before` (empty or the
          # zero SHA), and a force-push may have discarded the commit it names.
          # Skip LOUDLY — a visible warning, never a diff against nothing that
          # exits 0 and reads as verified. Every other bad base is the
          # script's to refuse (it exits 2 rather than passing).
          zero='0000000000000000000000000000000000000000'
          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            echo "::warning title=migrations guard did not run::no usable base ref on this ${{ github.event_name }} event (first push, force-push, or manual dispatch); the next pull request diffs the full change"
            exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning title=migrations guard did not run::base $base is not in the fetched history (a force-push discarded it); the next pull request diffs the full change"
            exit 0
          fi
          ./scripts/check-migrations-immutable.sh "$base"
