[package]
name    = "bare-axum"
version = "0.0.0"
edition = "2024"
publish = false

# The cost baseline: the same handlers, the same types, no OpenAPI crate at all.
[dependencies]
axum       = { version = "=0.8.9" }
tokio      = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net"] }
serde      = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
uuid       = { version = "=1.26.0", features = ["serde", "v4"] }
chrono     = { version = "=0.4.45", default-features = false, features = ["serde", "clock"] }
