version: "2"
sql:
  - engine: postgresql
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: gen
        out: gen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_sql_as_comment: true
        emit_empty_slices: true
        output_models_file_name: models.go
        overrides:
          # Reshape the GENERATED structs into domain types, so there is
          # nothing left to map by hand.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type: {type: "time.Time", pointer: true}
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type: {type: "int64", pointer: true}
          - db_type: "text"
            nullable: true
            go_type: {type: "string", pointer: true}
          - db_type: "jsonb"
            go_type: {import: "encoding/json", type: "RawMessage"}
