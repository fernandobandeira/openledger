# Spike 002 — the configuration ADR-0002 recommends, verified end to end.
version: "2"
sql:
  - engine: postgresql
    schema: schema.sql
    queries: queries.sql

    # Database-backed analyzer. OPTIONAL: without it sqlc still generates from
    # static analysis, it just types aggregates worse (see spike findings).
    # Unlike go-jet's generator, a live database is a soft dependency here.
    database:
      uri: "postgres://openledger:openledger@localhost:5433/openledger?sslmode=disable"
    analyzer:
      database: true

    gen:
      go:
        package: gen
        out: gen
        sql_package: pgx/v5

        emit_interface: true          # Querier — the seam for tx/metrics/authz decorators
        emit_db_tags: true            # pgx.RowToStructByNameLax reads `db` tags -> hand-written
                                      # dynamic queries scan into these same structs
        emit_json_tags: true
        emit_empty_slices: true
        emit_sql_as_comment: true     # the tuned SQL is visible at the call site
        emit_enum_valid_method: true
        emit_all_enum_values: true
        omit_unused_structs: true     # the single biggest sprawl reducer
        initialisms: ["id", "mcc", "api", "url"]

        overrides:
          # Reshape generated models into domain types so there is nothing to map.
          # NOTE: db_type must match the spelling used in the DDL, not the
          # canonical pg_catalog name -- a mismatch silently no-ops.
          - {db_type: "uuid",            go_type: "github.com/google/uuid.UUID"}
          - {db_type: "uuid",            nullable: true, go_type: {import: "github.com/google/uuid", type: "UUID", pointer: true}}
          - {db_type: "timestamptz",     go_type: "time.Time"}
          - {db_type: "timestamptz",     nullable: true, go_type: {type: "time.Time", pointer: true}}
          - {db_type: "pg_catalog.int8", nullable: true, go_type: {type: "int64", pointer: true}}
          - {db_type: "text",            nullable: true, go_type: {type: "string", pointer: true}}
          - {db_type: "jsonb",           go_type: {import: "encoding/json", type: "RawMessage"}}
